name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    # VM boot tests need entitlements + virtualization and run on dev machines
    # (scripts/spike.sh); CI covers build, lint, unit tests, and the guest
    # cross-compile.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --workspace
      - name: Guest binaries (linux musl cross-build)
        run: cargo build -p vessel-init -p vessel-agent --release --target aarch64-unknown-linux-musl

  linux-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --workspace

  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build (host stack + WHP backend, native Windows)
        run: cargo build --workspace

  slim:
    # slim/ is a separate workspace (excluded from the root), so the root jobs
    # above don't lint or test it. Gate it here with the same fmt + clippy bar.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: slim
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: slim
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test

  slim-engine:
    # The slim engine only exists on real Linux (namespaces, overlayfs,
    # cgroup2, iptables), so lint+unit tests can't tell us whether it still
    # runs containers. This job boots slimd inside a privileged container on
    # the runner — the same harness scripts/test-slim.sh uses inside the
    # vessel — and drives it with docker-slim.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: slim
      # zig is the musl C compiler for ring (see slim/scripts/build-musl.sh).
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.0
      - name: Build slimd + docker-slim (musl)
        run: |
          ARCH=x86_64 slim/scripts/build-musl.sh
          (cd slim && cargo build --release --target x86_64-unknown-linux-musl -p docker-slim)
      - name: Stage the suites
        run: |
          mkdir -p stage
          cp slim/target/x86_64-unknown-linux-musl/release/{slimd,docker-slim,pause} stage/
          cp slim/test/smoke.sh slim/test/appstack.sh stage/
          # `docker load` needs a real archive; the runner has a real docker.
          docker pull alpine:3.19
          docker save alpine:3.19 -o stage/load-image.tar
          gzip -9 -c stage/load-image.tar > stage/load-image.tar.gz
      - name: Engine smoke + app-stack suites
        env:
          # Anonymous Docker Hub pulls are rate limited on shared CI IPs.
          SLIM_REGISTRY_MIRROR: mirror.gcr.io
        run: |
          set -o pipefail
          fail=0
          for suite in smoke appstack; do
            echo "::group::$suite"
            docker run --rm --privileged -e SLIM_REGISTRY_MIRROR \
              -v "$PWD/stage:/slim" alpine:3.19 sh -c \
              "apk add --no-cache iptables ip6tables iproute2 >/dev/null 2>&1; sh /slim/$suite.sh" \
              > "$suite.log" 2>&1 || true
            cat "$suite.log"
            echo "::endgroup::"
            line=$(grep "RESULT:" "$suite.log" || echo "RESULT: no result line, 1 failed")
            echo "$suite: $line"
            case "$line" in *" 0 failed"*) ;; *) fail=1 ;; esac
          done
          exit $fail
