name: Release

# One workflow, one dependency graph.
#
# These were four workflows -- guest-images, release, embed-kit-linux and
# embed-kit-windows -- all triggered by the same tag, all starting at once.
# Three of them need the guest rootfs the first one builds, and `needs:` does
# not cross workflow boundaries, so they polled for each other's runs.
#
# That polling shipped a bug. `slimd` is built here and baked into the rootfs,
# so a kit that grabbed "the latest successful guest-images run" packaged the
# PREVIOUS release's engine: v0.1.5 advertised a `docker cp` fix that was not
# in the engine it shipped. The wait loop that fixed it had its own race --
# if the guest-images run had not been created yet, nothing was pending, so
# the loop fell straight through to the same stale fallback.
#
# In one workflow the ordering is declared rather than discovered, and the
# rootfs moves between jobs as a run artifact.
on:
  workflow_dispatch:
    inputs:
      notarize:
        description: "Apple notarize + staple (slow, ~15 min; required for distribution, off for pipeline test runs)"
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: write # attach release assets

jobs:
  guest-images:
    strategy:
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
            musl: aarch64-unknown-linux-musl
          - arch: x86_64
            runner: ubuntu-24.04
            musl: x86_64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.musl }}
      - uses: Swatinem/rust-cache@v2
      - name: Build kernel
        run: vessel/build-kernel.sh
        env:
          ARCH: ${{ matrix.arch }}
      - name: Build rootfs
        run: vessel/build-rootfs.sh
      - name: Package
        run: scripts/package-images.sh
      # nebula-slim guest: slimd + pause cross-built with zig as the musl
      # C compiler (ring), then the slim-flavor rootfs.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.0
      - name: Build slimd + pause (musl)
        run: ARCH=${{ matrix.arch }} slim/scripts/build-musl.sh
      - name: Build slim rootfs
        run: |
          export SLIMD_BIN="$PWD/slim/target/${{ matrix.musl }}/release/slimd"
          export PAUSE_BIN="$PWD/slim/target/${{ matrix.musl }}/release/pause"
          FLAVOR=slim vessel/build-rootfs.sh
      - name: Package slim rootfs
        run: |
          gzip -9 -c vessel/out/rootfs-slim.img > "dist/rootfs-slim-${{ matrix.arch }}.img.gz"
          (cd dist && shasum -a 256 "rootfs-slim-${{ matrix.arch }}.img.gz" >> "SHA256SUMS-${{ matrix.arch }}")
          ls -lh dist/
      - uses: actions/upload-artifact@v4
        with:
          name: guest-images-${{ matrix.arch }}
          path: dist/
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/kernel-Image-${{ matrix.arch }}.gz
            dist/rootfs-${{ matrix.arch }}.img.gz
            dist/rootfs-slim-${{ matrix.arch }}.img.gz
            dist/SHA256SUMS-${{ matrix.arch }}

  mac-release:
    needs: guest-images
    runs-on: macos-15 # arm64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Brew deps (libkrun fork toolchain + GPU userspace)
        env:
          # Homebrew 6.0 refuses formulae from untrusted taps in CI; trust
          # the tap explicitly (env var covers runners on older brew where
          # `brew trust` doesn't exist yet).
          HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
        run: |
          brew tap slp/krunkit
          brew trust slp/krunkit || true
          brew install zig llvm virglrenderer molten-vk

      - name: Tauri CLI
        run: cargo install tauri-cli --locked

      # Same run, so this is the artifact the guest-images job above
      # produced from this commit -- not "whatever finished most recently".
      - uses: actions/download-artifact@v4
        with:
          name: guest-images-arm64
          path: dist

      - name: Unpack the guest images
        run: |
          mkdir -p vessel/out
          # Unpacks every flavor the artifact carries, verifying checksums.
          # Do not hand-pick files here: omitting the slim rootfs is exactly
          # what made "Build the slim embed kit" fall through to a Docker
          # build on a runner that has no Docker.
          scripts/unpack-guest-images.sh dist arm64

      - name: Stamp the version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          committed=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          tagged="${GITHUB_REF_NAME#v}"
          if [ "$committed" != "$tagged" ]; then
            echo "::warning::Cargo.toml says $committed but the tag is $tagged; building as $tagged. Run scripts/set-version.sh before tagging."
          fi
          scripts/set-version.sh "$tagged" --no-lock

      - name: Build Nebula.app
        run: scripts/bundle-app.sh

      # Tags always get the real Developer ID + notarization; manual runs
      # only when asked — the ad-hoc DMG below is enough to verify the
      # pipeline and saves ~15 min per iteration.
      - name: Sign, notarize, staple
        if: startsWith(github.ref, 'refs/tags/v') || inputs.notarize
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: scripts/sign-release.sh

      - name: Package DMG (ad-hoc signed, no notarization)
        if: "!(startsWith(github.ref, 'refs/tags/v') || inputs.notarize)"
        run: |
          ver=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          mkdir -p dist
          hdiutil create -volname "Nebula" \
            -srcfolder ui/src-tauri/target/release/bundle/macos/Nebula.app \
            -ov -format UDZO "dist/Nebula_${ver}_aarch64.dmg" >/dev/null
          echo "ad-hoc DMG: dist/Nebula_${ver}_aarch64.dmg (right-click-open / xattr -d com.apple.quarantine to run)"

      - uses: actions/upload-artifact@v4
        with:
          name: Nebula-dmg-signed
          path: dist/Nebula_*_aarch64.dmg
          if-no-files-found: error

      # The macOS slim embed kit had no release path at all: dev-build.yml
      # builds it, but only as a workflow artifact, so an embedder could not
      # fetch a pinned copy the way the Linux and Windows kits allow. Named to
      # match those — nebula-slim-embed-<triple>.tar.gz — so a consumer's
      # download pattern does not need a per-platform special case.
      - name: Build the slim embed kit
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          scripts/embed-kit.sh --flavor slim --out dist-embed-slim
          tar -czf "dist/nebula-slim-embed-aarch64-apple-darwin.tar.gz" -C dist-embed-slim .
          ls -lh dist/nebula-slim-embed-*.tar.gz

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Nebula_*_aarch64.dmg
            dist/nebula-slim-embed-aarch64-apple-darwin.tar.gz

  linux-release:
    strategy:
      matrix:
        include:
          # Native runners for both arches — no cross toolchain needed.
          # arm64 covers the Apple-Silicon-class SoCs (NVIDIA/Qualcomm)
          # increasingly used for local AI workloads.
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build libkrun fork (.so)
        run: |
          cd third_party/libkrun
          cargo build --release -p libkrun --features blk,net
          ls -la target/release/libkrun.so*

      - name: Build nebula + nebulad
        run: cargo build --release -p nebula-cli -p nebulad

      - name: Package tarball
        run: |
          ver=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          stage="nebula-${ver}-linux-${{ matrix.arch }}"
          mkdir -p "dist/$stage/lib"
          cp target/release/nebula target/release/nebulad "dist/$stage/"
          # the krun backend looks for lib/libkrun.so.1 next to the binaries
          # (plain cargo emits libkrun.so; scripts/build-libkrun.sh adds
          # versioned names — accept either)
          src=$(ls third_party/libkrun/target/release/libkrun.so.*.* 2>/dev/null \
                || ls third_party/libkrun/target/release/libkrun.so)
          cp "$src" "dist/$stage/lib/libkrun.so.1"
          tar -C dist -czf "dist/$stage.tar.gz" "$stage"
          (cd dist && shasum -a 256 "$stage.tar.gz" > "$stage.tar.gz.sha256")
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: nebula-linux-${{ matrix.arch }}
          path: dist/nebula-*-linux-${{ matrix.arch }}.tar.gz*
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/nebula-*-linux-${{ matrix.arch }}.tar.gz*

  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build krun.dll (fork, WHP backend)
        shell: pwsh
        run: |
          cd third_party/libkrun
          # init-blob compiles a Linux init.c we never use; bypass on Windows hosts.
          New-Item -ItemType File -Force -Path stub-init | Out-Null
          $env:KRUN_INIT_BINARY_PATH = (Resolve-Path stub-init).Path
          cargo build --release -p libkrun --features blk,net
          Get-Item target/release/krun.dll

      - name: Build nebula + nebulad
        run: cargo build --release -p nebula-cli -p nebulad

      - name: Package zip
        shell: pwsh
        run: |
          $ver = (Select-String -Path Cargo.toml -Pattern '^version.*"(.+)"' | Select-Object -First 1).Matches.Groups[1].Value
          $stage = "nebula-$ver-windows-x86_64"
          New-Item -ItemType Directory -Force -Path "dist/$stage" | Out-Null
          Copy-Item target/release/nebula.exe, target/release/nebulad.exe "dist/$stage/"
          # the krun backend probes for krun.dll next to the binaries
          Copy-Item third_party/libkrun/target/release/krun.dll "dist/$stage/"
          Compress-Archive -Path "dist/$stage" -DestinationPath "dist/$stage.zip"
          $hash = (Get-FileHash "dist/$stage.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $stage.zip" | Set-Content -Encoding ascii "dist/$stage.zip.sha256"
          Get-ChildItem dist/

      - uses: actions/upload-artifact@v4
        with:
          name: nebula-windows-x86_64
          path: dist/nebula-*-windows-x86_64.zip*
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/nebula-*-windows-x86_64.zip*

  # nebula-slim host CLIs: docker-slim / kubectl-slim / helm-slim — pure
  # Rust, no Go runtime, the embed kit's client side. The slim guest
  # (rootfs-slim) ships from the Guest images workflow.
  slim-clis:
    strategy:
      matrix:
        include:
          - { runner: macos-15, os: macos, arch: aarch64 }
          - { runner: ubuntu-24.04, os: linux, arch: x86_64 }
          - { runner: ubuntu-24.04-arm, os: linux, arch: aarch64 }
          - { runner: windows-latest, os: windows, arch: x86_64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: slim
      - name: Build slim CLIs
        working-directory: slim
        run: cargo build --release -p docker-slim -p kubectl-slim -p helm-slim
      - name: Package
        shell: bash
        run: |
          ver=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          stage="nebula-slim-clis-${ver}-${{ matrix.os }}-${{ matrix.arch }}"
          mkdir -p "dist/$stage"
          ext=""
          [ "${{ matrix.os }}" = "windows" ] && ext=".exe"
          for b in docker-slim kubectl-slim helm-slim; do
            cp "slim/target/release/$b$ext" "dist/$stage/"
          done
          tar -C dist -czf "dist/$stage.tar.gz" "$stage"
          (cd dist && shasum -a 256 "$stage.tar.gz" > "$stage.tar.gz.sha256"             || sha256sum "$stage.tar.gz" > "$stage.tar.gz.sha256")
          ls -lh dist/
      - uses: actions/upload-artifact@v4
        with:
          name: nebula-slim-clis-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/nebula-slim-clis-*.tar.gz*
          if-no-files-found: error
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/nebula-slim-clis-*.tar.gz*

  kit-linux:
    needs: guest-images
    strategy:
      matrix:
        include:
          # Native runners for both arches — no cross toolchain needed.
          - runner: ubuntu-24.04
            arch: x86_64
            img_arch: x86_64 # guest-images.yml artifact naming
            galaxy_arch: x64 # Galaxy fetch-nebula.mjs naming (node process.arch)
          - runner: ubuntu-24.04-arm
            arch: aarch64
            img_arch: arm64
            galaxy_arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build libkrun fork (.so)
        run: |
          cd third_party/libkrun
          cargo build --release -p libkrun --features blk,net
          ls -la target/release/libkrun.so*

      - name: Build nebula + nebulad
        run: cargo build --release -p nebula-cli -p nebulad

      # Same run, so this is the artifact the guest-images job above
      # produced from this commit -- not "whatever finished most recently".
      - uses: actions/download-artifact@v4
        with:
          name: guest-images-${{ matrix.img_arch }}
          path: guest
      - name: Assemble kit
        run: |
          OUT=dist-embed-slim-linux
          mkdir -p "$OUT/bin" "$OUT/lib" "$OUT/images"
          cp target/release/nebula target/release/nebulad "$OUT/bin/"
          # The slim engine has no docker/kubectl/helm to talk to it with;
          # ship the pure-Rust clients, same as the macOS kit does.
          scripts/stage-slim-clis.sh "$OUT/bin"
          # the krun backend looks for lib/libkrun.so.1 next to the binaries
          # (or NEBULA_LIBKRUN_PATH); plain cargo emits libkrun.so — accept either
          src=$(ls third_party/libkrun/target/release/libkrun.so.*.* 2>/dev/null \
                || ls third_party/libkrun/target/release/libkrun.so)
          cp "$src" "$OUT/lib/libkrun.so.1"
          cp "guest/kernel-Image-${{ matrix.img_arch }}.gz" "$OUT/images/kernel-Image.gz"
          cp "guest/rootfs-slim-${{ matrix.img_arch }}.img.gz" "$OUT/images/rootfs.img.gz"
          cat > "$OUT/config.toml.example" <<'EOF'
          # Per-instance Nebula settings — copy to $NEBULA_HOME/config.toml before
          # the first `nebula up`. Every value is optional.

          # Resource ceilings.
          max_ram_mib = 8192
          cpus = 4
          data_disk_gib = 32

          # Isolation from a standalone Nebula install (and other embedders):
          api_port = 7461          # REST API on 127.0.0.1 (0 disables)
          dns_port = 42061         # host UDP port for the guest DNS relay
          k8s_port = 6461          # host forward to this instance's k3s API

          # Brand the container DNS zone: <name>.<zone> resolves on this instance.
          dns_zone = "galaxy.local"

          # Published ports bind 127.0.0.1 unless this is on. Turn it on to honour the
          # container's own publish address — `-p 0.0.0.0:6900:6900` then reaches the
          # LAN, which is what a multiplayer game server or a shared dev service needs.
          # It exposes those ports to the network, so it is off by default.
          allow_public_publish = false
          EOF
          # Licences travel with the binaries: the kit ships a modified
          # Apache-2.0 fork of libkrun, and an embedder redistributes it
          # inside their own app. Mirrors scripts/embed-kit.sh on macOS.
          mkdir -p "$OUT/licenses"
          cp THIRD-PARTY-LICENSES.md "$OUT/licenses/"
          cp LICENSE "$OUT/licenses/LICENSE.nebula"

          cat > "$OUT/EMBED.md" <<'EOF'
          # nebula-slim embed kit (Linux)

          Boot (requires /dev/kvm):
            export NEBULA_HOME=<your instance dir>
            export NEBULA_LIBKRUN_PATH=<kit>/lib/libkrun.so.1   # or keep lib/ next to bin/
            bin/nebula install-image --kernel images/kernel-Image.gz --rootfs images/rootfs.img.gz
            bin/nebula up
          Docker socket: $NEBULA_HOME/run/docker.sock (slimd, Docker API v1.43).

          Clients are in bin/ — no separate download:
            export DOCKER_HOST=unix://$NEBULA_HOME/run/docker.sock
            bin/docker-slim ps          # also: bin/kubectl-slim, bin/helm-slim
          EOF
          tar -C "$OUT" -czf "nebula-slim-embed-${{ matrix.galaxy_arch }}-unknown-linux.tar.gz" .
          ls -lh nebula-slim-embed-*.tar.gz

      # The proof: boot the exact assembled kit on the runner (hosted runners
      # expose /dev/kvm) and hit the slimd Docker socket. Skips with a warning
      # if the runner has no KVM rather than failing the packaging.
      - name: Smoke-boot the kit (KVM)
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "::warning::no /dev/kvm on this runner — kit packaged but not boot-tested"
            exit 0
          fi
          sudo chmod 666 /dev/kvm || true
          KIT=$PWD/dist-embed-slim-linux
          export NEBULA_HOME=$(mktemp -d)
          export NEBULA_LIBKRUN_PATH="$KIT/lib/libkrun.so.1"
          "$KIT/bin/nebula" install-image --kernel "$KIT/images/kernel-Image.gz" --rootfs "$KIT/images/rootfs.img.gz"
          "$KIT/bin/nebula" up
          ok=""
          for i in $(seq 1 90); do
            v=$(curl -sf --max-time 2 --unix-socket "$NEBULA_HOME/run/docker.sock" http://localhost/version 2>/dev/null) && { ok="$v"; break; }
            sleep 1
          done
          # The shipped client must drive the shipped engine — that is what
          # "no second download" means, and it is the thing that silently was
          # not true until this kit started carrying the slim CLIs.
          cli_ok=""
          if [ -n "$ok" ]; then
            DOCKER_HOST="unix://$NEBULA_HOME/run/docker.sock" \
              "$KIT/bin/docker-slim" version && cli_ok=1
          fi
          "$KIT/bin/nebula" down || true
          if [ -z "$ok" ]; then
            echo "::error::engine did not come up from the assembled kit"
            exit 1
          fi
          if [ -z "$cli_ok" ]; then
            echo "::error::bin/docker-slim could not talk to the kit's engine"
            exit 1
          fi
          echo "engine version: $ok"
          echo "$ok" | grep -qi slim || { echo "::error::expected the slim engine"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: nebula-slim-embed-${{ matrix.galaxy_arch }}-unknown-linux
          path: nebula-slim-embed-*.tar.gz
          if-no-files-found: error

      # Tags publish the kit as a release asset. Embedders — Galaxy, Ragnarok
      # Offline — need to fetch a pinned kit without a token that can reach
      # workflow artifacts, and `gh release download` is the only fetch that
      # works the same from CI, a script and a person's shell.
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: nebula-slim-embed-*.tar.gz

  kit-windows:
    needs: guest-images
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build krun.dll (fork, WHP backend)
        shell: pwsh
        run: |
          cd third_party/libkrun
          # init-blob compiles a Linux init.c we never use; bypass on Windows hosts.
          New-Item -ItemType File -Force -Path stub-init | Out-Null
          $env:KRUN_INIT_BINARY_PATH = (Resolve-Path stub-init).Path
          cargo build --release -p libkrun --features blk,net
          Get-Item target/release/krun.dll

      - name: Build nebula + nebulad
        run: cargo build --release -p nebula-cli -p nebulad

      # Same run, so this is the artifact the guest-images job above
      # produced from this commit -- not "whatever finished most recently".
      - uses: actions/download-artifact@v4
        with:
          name: guest-images-x86_64
          path: guest
      - name: Assemble kit
        shell: bash
        run: |
          OUT=dist-embed-slim-windows
          mkdir -p "$OUT/bin" "$OUT/lib" "$OUT/images"
          cp target/release/nebula.exe target/release/nebulad.exe "$OUT/bin/"
          # The slim engine has no docker/kubectl/helm to talk to it with;
          # ship the pure-Rust clients, same as the macOS and Linux kits do.
          scripts/stage-slim-clis.sh "$OUT/bin"
          # the krun backend probes lib/krun.dll next to the binaries
          # (or NEBULA_LIBKRUN_PATH)
          cp third_party/libkrun/target/release/krun.dll "$OUT/lib/"
          cp guest/kernel-Image-x86_64.gz "$OUT/images/kernel-Image.gz"
          cp guest/rootfs-slim-x86_64.img.gz "$OUT/images/rootfs.img.gz"
          cat > "$OUT/config.toml.example" <<'EOF'
          # Per-instance Nebula settings — copy to %NEBULA_HOME%\config.toml before
          # the first `nebula up`. Every value is optional.

          # Resource ceilings.
          max_ram_mib = 8192
          cpus = 4
          data_disk_gib = 32

          # Isolation from a standalone Nebula install (and other embedders):
          api_port = 7461          # REST API on 127.0.0.1 (0 disables)
          dns_port = 42061         # host UDP port for the guest DNS relay
          k8s_port = 6461          # host forward to this instance's k3s API

          # Brand the container DNS zone: <name>.<zone> resolves on this instance.
          dns_zone = "galaxy.local"

          # Published ports bind 127.0.0.1 unless this is on. Turn it on to honour the
          # container's own publish address — `-p 0.0.0.0:6900:6900` then reaches the
          # LAN, which is what a multiplayer game server or a shared dev service needs.
          # It exposes those ports to the network, so it is off by default.
          allow_public_publish = false
          EOF
          # Licences travel with the binaries: the kit ships a modified
          # Apache-2.0 fork of libkrun, and an embedder redistributes it
          # inside their own app. Mirrors scripts/embed-kit.sh on macOS.
          mkdir -p "$OUT/licenses"
          cp THIRD-PARTY-LICENSES.md "$OUT/licenses/"
          cp LICENSE "$OUT/licenses/LICENSE.nebula"

          cat > "$OUT/EMBED.md" <<'EOF'
          # nebula-slim embed kit (Windows, WHP/Hyper-V)

          Requires the Windows Hypervisor Platform feature (no WSL2, no Docker
          Desktop). Boot:
            set NEBULA_HOME=<your instance dir>
            set NEBULA_LIBKRUN_PATH=<kit>\lib\krun.dll   (or keep lib\ next to bin\)
            bin\nebula.exe install-image --kernel images\kernel-Image.gz --rootfs images\rootfs.img.gz
            bin\nebula.exe up
          Docker API: %NEBULA_HOME%\run\docker.sock is a FILE containing a
          loopback TCP port — connect to http://127.0.0.1:<port>/ (slimd,
          Docker API v1.43). No virtiofs on Windows yet: host bind mounts are
          unavailable; use volumes + the archive API to move files in and out.

          Clients are in bin\ — no separate download:
            set DOCKER_HOST=tcp://127.0.0.1:<port>
            bin\docker-slim.exe ps   (also kubectl-slim.exe, helm-slim.exe)
          EOF
          tar -czf "nebula-slim-embed-x64-pc-windows.tar.gz" -C "$OUT" .
          ls -lh nebula-slim-embed-*.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: nebula-slim-embed-x64-pc-windows
          path: nebula-slim-embed-*.tar.gz
          if-no-files-found: error

      # Tags publish the kit as a release asset. Embedders — Galaxy, Ragnarok
      # Offline — need to fetch a pinned kit without a token that can reach
      # workflow artifacts, and `gh release download` is the only fetch that
      # works the same from CI, a script and a person's shell.
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: nebula-slim-embed-*.tar.gz
