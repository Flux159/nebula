name: Guest images

# Builds the Vessel kernel + rootfs on a native arm64 Linux runner (Docker is
# preinstalled there — end users never need Docker; they download these).
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build-guest-images:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: Build kernel
        run: vessel/build-kernel.sh
      - name: Build rootfs
        run: vessel/build-rootfs.sh
      - name: Package
        run: scripts/package-images.sh
      - uses: actions/upload-artifact@v4
        with:
          name: guest-images
          path: dist/
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/kernel-Image.gz
            dist/rootfs.img.gz
            dist/SHA256SUMS
