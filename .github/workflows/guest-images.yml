name: Guest images

# Builds the Vessel kernel + rootfs for both guest arches on native Linux
# runners (Docker is preinstalled there — end users never need Docker; they
# download these via `nebula up` / the image bootstrap).
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build-guest-images:
    strategy:
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
            musl: aarch64-unknown-linux-musl
          - arch: x86_64
            runner: ubuntu-24.04
            musl: x86_64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.musl }}
      - uses: Swatinem/rust-cache@v2
      - name: Build kernel
        run: vessel/build-kernel.sh
      - name: Build rootfs
        run: vessel/build-rootfs.sh
      - name: Package
        run: scripts/package-images.sh
      - uses: actions/upload-artifact@v4
        with:
          name: guest-images-${{ matrix.arch }}
          path: dist/
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/kernel-Image-${{ matrix.arch }}.gz
            dist/rootfs-${{ matrix.arch }}.img.gz
            dist/SHA256SUMS-${{ matrix.arch }}
