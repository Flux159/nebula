[workspace]
resolver = "2"
exclude = ["third_party", "ui"]
members = [
    "crates/nebula-core",
    "crates/nebula-cli",
    "crates/nebula-display",
    "crates/nebulad",
    "crates/nebula-balloon",
    "crates/nebula-battletest",
    "crates/vessel-agent",
    "crates/vessel-display",
    "crates/vessel-init",
]

[workspace.package]
version = "0.2.2"
edition = "2021"
license = "MIT"
repository = "https://github.com/Flux159/nebula"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
libc = "0.2"
# REST API server (nebulad): hyper directly — smaller than axum, same tokio
# core, and our routing is a dozen fixed paths plus a raw docker proxy.
tokio = { version = "1", features = ["rt", "net", "io-util", "time", "fs"] }
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"

[profile.release]
lto = "thin"
strip = true
