[package]
name = "{{APP_CRATE}}"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The app's own API server (src/server.rs) and its client to the Nebula
# engine (src/nebula.rs) — the same stack nebulad serves with. Components
# (model-config, …) add routes to the server and tables to the db.
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "tokio"] }
http-body-util = "0.1"
bytes = "1"
tokio = { version = "1", features = ["rt", "net", "io-util", "time"] }
# App persistence (settings, API keys, your domain tables). `bundled`
# compiles SQLite in — no system dependency.
rusqlite = { version = "0.32", features = ["bundled"] }

[lib]
name = "{{APP_CRATE}}_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
