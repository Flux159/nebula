[project]
name = "nebula-vm"
version = "0.2.0"
description = "Client SDK for Nebula — containers, Kubernetes, and microVMs on macOS"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[project.urls]
Repository = "https://github.com/Flux159/nebula"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["nebula_vm"]
