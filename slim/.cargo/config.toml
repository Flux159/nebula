# Guest binaries (slimd) cross-build to musl, same as the main repo's
# vessel-init/vessel-agent. rust-lld covers pure-Rust crates; C deps (ring)
# need a real cross cc — scripts/zigcc-*-musl wrap `zig cc` for that
# (same trick as the main repo's build-libkrun.sh).
[target.aarch64-unknown-linux-musl]
linker = "rust-lld"
rustflags = ["-C", "target-feature=+crt-static"]

[target.x86_64-unknown-linux-musl]
linker = "rust-lld"
rustflags = ["-C", "target-feature=+crt-static"]

[env]
CC_aarch64_unknown_linux_musl = { value = "scripts/zigcc-aarch64-musl", relative = true }
AR_aarch64_unknown_linux_musl = { value = "scripts/zigar", relative = true }
CC_x86_64_unknown_linux_musl = { value = "scripts/zigcc-x86_64-musl", relative = true }
